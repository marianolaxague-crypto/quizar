<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brújula Política AR</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/quiz-light.css">
</head>
<body class="quiz-page">

<div class="qp-shell">

  <!-- Counter (oculto, mantenido para compatibilidad JS) -->
  <div class="qp-counter" id="progress-text" aria-hidden="true"></div>

  <!-- Área de pregunta (fade in/out) -->
  <div class="qp-question-area" id="question-area"></div>

  <!-- Nav row: volver + progress ring (centrado) -->
  <div class="qp-ring-row" id="ring-row" style="visibility:hidden">
    <button class="qp-back-btn" id="back-btn" style="visibility:hidden" onclick="prevQuestion()">&#8592; Volver</button>
    <svg class="qp-ring-svg" id="fingerprint" viewBox="0 0 100 100">
      <!-- generado por JS -->
    </svg>
    <div class="qp-ring-spacer"></div>
  </div>

</div>

<script src="/static/js/quiz.js"></script>
</body>
</html>
