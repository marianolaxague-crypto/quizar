<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brújula Política AR — ¿Dónde estás en el mapa político argentino?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ── */
    :root {
      --dark:       #0F0F23;
      --dark-card:  #161630;
      --yellow:     #FFE600;
      --yellow-dim: rgba(255,230,0,0.12);
      --yellow-bdr: rgba(255,230,0,0.30);
      --white:      #FFFFFF;
      --white-70:   rgba(255,255,255,0.70);
      --white-40:   rgba(255,255,255,0.40);
      --white-15:   rgba(255,255,255,0.15);
      --white-08:   rgba(255,255,255,0.08);
      --white-05:   rgba(255,255,255,0.05);
      --pixel-font: 'Press Start 2P', monospace;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--dark);
      color: var(--white);
      min-height: 100vh;
      line-height: 1.6;
    }

    a { text-decoration: none; }

    /* ── Header ── */
    .lnd-header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--white-08);
    }
    .lnd-logo {
      font-family: var(--pixel-font);
      font-size: 0.6rem;
      color: var(--white);
      line-height: 1.6;
      letter-spacing: 0;
    }
    .lnd-logo span { color: var(--yellow); }

    /* ── Hero — container relativo para el video ── */
    .lnd-hero-wrap {
      position: relative;
      min-height: 88vh;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    /* ── Video de fondo ── */
    .lnd-hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 0.55;
      z-index: 0;
    }

    /* ── Overlay gradiente para legibilidad ── */
    .lnd-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(15,15,35,0.50) 0%,
        rgba(15,15,35,0.55) 50%,
        rgba(15,15,35,0.92) 100%
      );
      z-index: 1;
    }

    /* ── Efecto scanlines retro (muy sutil) ── */
    .lnd-hero-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.04) 2px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
      z-index: 2;
    }

    /* ── Contenido del hero (sobre el video) ── */
    .lnd-hero {
      position: relative;
      z-index: 5;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 56px 24px 64px;
    }

    .lnd-hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--pixel-font);
      font-size: 0.38rem;
      letter-spacing: 1px;
      color: var(--yellow);
      background: var(--yellow-dim);
      border: 1px solid var(--yellow-bdr);
      padding: 7px 12px;
      border-radius: 4px;
      margin-bottom: 28px;
      line-height: 1.8;
    }

    .lnd-hero-h1 {
      font-size: clamp(2.6rem, 9vw, 5.5rem);
      font-weight: 900;
      line-height: 1.0;
      letter-spacing: -2px;
      margin-bottom: 24px;
      color: var(--white);
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }
    .lnd-hero-h1 em {
      color: var(--yellow);
      font-style: normal;
    }

    .lnd-hero-sub {
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      color: var(--white-70);
      max-width: 460px;
      line-height: 1.65;
      margin-bottom: 40px;
      text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    }

    .lnd-hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--yellow);
      color: var(--dark);
      font-family: var(--pixel-font);
      font-size: 0.55rem;
      font-weight: 400;
      padding: 16px 28px;
      border-radius: 4px;
      letter-spacing: 0;
      line-height: 1.8;
      transition: background 0.15s, transform 0.15s;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.4);
    }
    .lnd-hero-cta:hover {
      background: #FFD000;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 rgba(0,0,0,0.4);
    }
    .lnd-hero-cta:active {
      transform: translate(0, 0);
      box-shadow: 2px 2px 0 rgba(0,0,0,0.4);
    }

    /* ── Games section ── */
    .lnd-games {
      max-width: 1080px;
      margin: 0 auto;
      padding: 48px 24px 100px;
    }

    .lnd-section-label {
      font-family: var(--pixel-font);
      font-size: 0.42rem;
      letter-spacing: 1.5px;
      color: var(--white-40);
      margin-bottom: 20px;
      line-height: 2;
    }

    .lnd-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ── J1 — card activa ── */
    .lnd-card-j1 {
      grid-column: 1 / -1;
      background: var(--dark-card);
      border: 2px solid var(--yellow);
      border-radius: 4px;
      padding: 28px 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: var(--white);
      transition: transform 0.12s, box-shadow 0.12s;
      box-shadow: 4px 4px 0 rgba(255,230,0,0.25);
    }
    .lnd-card-j1:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 rgba(255,230,0,0.35);
      color: var(--white);
    }

    .lnd-card-icon { font-size: 2rem; line-height: 1; }

    .lnd-card-title {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--white);
    }

    .lnd-card-desc {
      font-size: 0.875rem;
      color: var(--white-70);
      line-height: 1.55;
    }

    .lnd-card-reward {
      font-size: 0.8rem;
      color: var(--yellow);
      line-height: 1.4;
    }

    .lnd-card-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--white-40);
      border-top: 1px solid var(--white-08);
      padding-top: 12px;
    }

    .lnd-card-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--yellow);
      color: var(--dark);
      font-family: var(--pixel-font);
      font-size: 0.45rem;
      padding: 12px 18px;
      border-radius: 4px;
      align-self: flex-start;
      line-height: 1.8;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .lnd-card-j1:hover .lnd-card-btn {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
    }

    /* ── J2/J3 — próximamente ── */
    .lnd-card-soon {
      background: var(--white-05);
      border: 1px solid var(--white-08);
      border-radius: 4px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lnd-soon-badge {
      font-family: var(--pixel-font);
      font-size: 0.36rem;
      color: var(--white-40);
      background: var(--white-08);
      padding: 5px 8px;
      border-radius: 2px;
      display: inline-block;
      margin-bottom: 2px;
      line-height: 2;
    }

    .lnd-card-soon .lnd-card-icon  { font-size: 1.5rem; opacity: 0.40; }
    .lnd-card-soon .lnd-card-title { font-size: 0.9rem;  color: rgba(255,255,255,0.35); }
    .lnd-card-soon .lnd-card-desc  { font-size: 0.78rem; color: rgba(255,255,255,0.25); }

    /* ── Desktop ── */
    @media (min-width: 700px) {
      .lnd-header { padding: 22px 40px; }
      .lnd-hero   { padding: 100px 40px 80px; }
      .lnd-games  { padding: 56px 40px 100px; }

      .lnd-hero-wrap { min-height: 90vh; }

      .lnd-grid {
        grid-template-columns: 1.7fr 1fr 1fr;
        align-items: start;
      }
      .lnd-card-j1 {
        grid-column: 1;
        grid-row: 1 / 3;
      }
    }

    @media (min-width: 1024px) {
      .lnd-logo   { font-size: 0.65rem; }
      .lnd-hero-h1 { letter-spacing: -3px; }
    }

    /* ── Fallback: sin video (fondo sólido) ── */
    .lnd-hero-video:not([src]) { display: none; }
  </style>
</head>
<body>

<header class="lnd-header">
  <div class="lnd-logo">Brujula <span>Politica AR</span></div>
</header>

<div class="lnd-hero-wrap">

  <!-- Video de fondo — reemplazar src con el archivo generado -->
  <video class="lnd-hero-video" autoplay loop muted playsinline>
    <source src="/static/video/hero.mp4" type="video/mp4">
    <source src="/static/video/hero.webm" type="video/webm">
  </video>

  <!-- Overlay de legibilidad -->
  <div class="lnd-hero-overlay"></div>

  <!-- Contenido del hero -->
  <section class="lnd-hero">
    <div class="lnd-hero-tag">3 JUEGOS &middot; POLITICA ARGENTINA</div>
    <h1 class="lnd-hero-h1">
      &iquest;D&oacute;nde est&aacute;s<br>en el <em>mapa<br>pol&iacute;tico?</em>
    </h1>
    <p class="lnd-hero-sub">
      Tres experiencias para descubrir tu ideolog&iacute;a, tu afinidad con los bloques y tus candidatos. Sin respuestas correctas.
    </p>
    <a href="/quiz?type=j1" class="lnd-hero-cta">EMPEZAR &rarr;</a>
  </section>

</div>

<section class="lnd-games">
  <div class="lnd-section-label">// LOS JUEGOS</div>
  <div class="lnd-grid" id="lnd-grid">
    <!-- populated by JS -->
  </div>
</section>

<script>
const QUIZZES = [
  {
    id:        "j1",
    title:     "Brújula Ideológica",
    desc:      "19 dilemas reales. Dos posturas por cada uno. Sin respuestas correctas.",
    icon:      "🧭",
    questions: 19,
    minutes:   4,
    reward:    "🎁 Tu posición en el mapa político + tu arquetipo ideológico",
    ready:     true
  },
  {
    id:    "j2",
    title: "El Legislador",
    desc:  "Votá 12 proyectos reales o ficticios y descubrí a qué bloque político te parecés.",
    icon:  "🗳️",
    ready: false
  },
  {
    id:    "j3",
    title: "¿Mi candidato?",
    desc:  "Elegí entre pares de figuras políticas. El sistema calcula a quién preferís más.",
    icon:  "🎯",
    ready: false
  }
];

const grid = document.getElementById("lnd-grid");

QUIZZES.forEach(q => {
  if (q.ready) {
    grid.innerHTML += `
      <a class="lnd-card-j1" href="/quiz?type=${q.id}">
        <div class="lnd-card-icon">${q.icon}</div>
        <div class="lnd-card-title">${q.title}</div>
        <div class="lnd-card-desc">${q.desc}</div>
        <div class="lnd-card-reward">${q.reward}</div>
        <div class="lnd-card-meta">
          <span>${q.minutes} min</span>
          <span>${q.questions} preguntas</span>
        </div>
        <div class="lnd-card-btn">EMPEZAR →</div>
      </a>`;
  } else {
    grid.innerHTML += `
      <div class="lnd-card-soon">
        <div class="lnd-soon-badge">PROXIMAMENTE</div>
        <div class="lnd-card-icon">${q.icon}</div>
        <div class="lnd-card-title">${q.title}</div>
        <div class="lnd-card-desc">${q.desc}</div>
      </div>`;
  }
});
</script>

</body>
</html>
