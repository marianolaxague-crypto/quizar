<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Br&uacute;jula Pol&iacute;tica Argentina</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header>
  <div class="container">
    <div class="inner">
      <div class="logo">Br&uacute;jula <span>Pol&iacute;tica AR</span></div>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <section class="hero">
      <div class="hero-tag">3 juegos &middot; pol&iacute;tica argentina</div>
      <h1>&iquest;D&oacute;nde est&aacute;s en el<br><em>mapa pol&iacute;tico argentino?</em></h1>
      <p>Tres experiencias para explorar tus ideas, tus afinidades y tus preferencias pol&iacute;ticas. El primero ya est&aacute; disponible.</p>
    </section>

    <div class="quiz-grid" id="quiz-grid">
      <!-- populated by JS -->
    </div>
  </div>
</main>

<script>
const QUIZZES = [
  {
    id:       "j1",
    title:    "Br\u00fajula Ideol\u00f3gica",
    subtitle: "19 dilemas reales. Dos posturas por cada uno. Sin respuestas correctas.",
    icon:     "\uD83E\uDDED",
    questions: 19,
    minutes:  4,
    reward:   "Tu posici\u00f3n en el mapa pol\u00edtico + comparaci\u00f3n con otros jugadores",
    ready:    true
  },
  {
    id:       "j2",
    title:    "El Legislador",
    subtitle: "Vot\u00e1 12 proyectos reales o ficticios y descubr\u00ed a qu\u00e9 bloque pol\u00edtico te parec\u00e9s.",
    icon:     "\uD83D\uDDF3\uFE0F",
    questions: 12,
    minutes:  5,
    reward:   "Tu bloque af\u00edn + perfil de lealtad partidaria",
    ready:    false
  },
  {
    id:       "j3",
    title:    "\u00bfMi candidato?",
    subtitle: "Eleg\u00ed entre pares de figuras pol\u00edticas. El sistema calcula a qui\u00e9n prefer\u00eds m\u00e1s.",
    icon:     "\uD83C\uDFAF",
    questions: 20,
    minutes:  4,
    reward:   "Tu ranking personal de figuras pol\u00edticas argentinas",
    ready:    false
  }
];

const grid = document.getElementById("quiz-grid");

QUIZZES.forEach(q => {
  if (q.ready) {
    const meta = `<span>${q.minutes} min</span><span class="meta-questions">${q.questions} preguntas</span>`;
    grid.innerHTML += `
      <a class="quiz-card" href="/quiz?type=${q.id}">
        <div class="icon">${q.icon}</div>
        <h2>${q.title}</h2>
        <p class="card-subtitle">${q.subtitle}</p>
        <p class="card-reward">\uD83C\uDF81 ${q.reward}</p>
        <div class="meta">${meta}</div>
        <div class="card-cta">Empezar \u2192</div>
      </a>`;
  } else {
    grid.innerHTML += `
      <div class="quiz-card disabled">
        <div class="quiz-coming-badge">Pr\u00f3ximamente</div>
        <div class="icon">${q.icon}</div>
        <h2>${q.title}</h2>
        <p class="card-subtitle">${q.subtitle}</p>
        <p class="card-reward">\uD83C\uDF81 ${q.reward}</p>
      </div>`;
  }
});
</script>

</body>
</html>
